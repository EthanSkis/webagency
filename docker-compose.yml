version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: webagency-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: webagency
    ports:
      - "5432:5432"
    volumes:
      - webagency-pgdata:/var/lib/postgresql/data

  mailhog:
    image: mailhog/mailhog:latest
    container_name: webagency-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # UI

volumes:
  webagency-pgdata:
